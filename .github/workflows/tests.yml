# Tests automatiques : à chaque poussée et à chaque pull request.
name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:      # bouton « lancer » manuel dans l'onglet Actions

concurrency:
  # deux poussées rapprochées : on annule la première, elle ne sert plus à rien
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # La suite tourne en 30 s ; au-delà de 20 min c'est qu'une étape est
    # bloquée sur le réseau, et un job zombie consomme le quota gratuit.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = le plancher annoncé dans pyproject, 3.13 = ce que les gens ont.
        # Tester les deux bouts attrape les régressions de compatibilité sans
        # payer une matrice complète.
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 s'installe depuis PyPI, mais Qt a besoin de bibliothèques
      # système même en rendu « offscreen » : sans elles, l'import réussit et
      # c'est la création de la QGuiApplication qui échoue, plusieurs tests
      # plus loin, avec un message incompréhensible.
      - name: Bibliothèques Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0

      - name: Installation
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # Le mois sert de clé de cache : la base de cartes se rafraîchit ainsi
      # d'elle-même après un patch d'équilibrage, sans intervention.
      - name: Mois courant
        id: mois
        run: echo "cle=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # LA raison d'être de l'étape suivante : sans la base de cartes, 202 tests
      # sur 386 se sautent et la CI afficherait vert sans avoir rien vérifié.
      # Le cache évite de retélécharger 8 Mo à chaque exécution.
      - name: Cache de la base de cartes
        uses: actions/cache@v4
        with:
          path: data/cards
          key: cartes-${{ hashFiles('src/cairn/cards_fetch.py') }}-${{ steps.mois.outputs.cle }}
          restore-keys: |
            cartes-${{ hashFiles('src/cairn/cards_fetch.py') }}-
            cartes-

      - name: Base de cartes
        run: cairn-cards

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen   # aucun écran sur un runner
        run: pytest -q --junitxml=report-${{ matrix.python }}.xml

      # Un « vert » obtenu en sautant la moitié de la suite est pire qu'un
      # rouge : il affirme que tout va bien. Cette étape le transforme en échec.
      - name: La suite a-t-elle vraiment tourné ?
        if: always()
        run: python tools/ci_check_skips.py report-${{ matrix.python }}.xml --max-skips 10

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ matrix.python }}
          path: report-${{ matrix.python }}.xml
          if-no-files-found: ignore
